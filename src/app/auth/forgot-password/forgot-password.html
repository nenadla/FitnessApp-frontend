<main class="flex min-h-screen items-center justify-center bg-neutral-100 p-4">
  <mat-card class="w-full max-w-md p-6 sm:p-8">
    <h1 class="m-0 text-3xl font-semibold">Zaboravljena lozinka</h1>
    <p class="mt-2 text-neutral-600">Unesi email adresu i poslaćemo ti link za resetovanje lozinke.</p>

    @if (successMessage()) {
      <div class="mt-6 rounded-md border border-green-300 bg-green-50 p-4 text-green-800">
        {{ successMessage() }}
      </div>
      <a class="mt-4 inline-block text-sm font-medium text-blue-700 hover:underline" routerLink="/login">
        Nazad na prijavu
      </a>
    } @else {
      <form class="mt-6 grid gap-2" (submit)="submit($event)">
        <app-text-input label="Email" type="email" autocomplete="email" [field]="form.email" />

        <app-button class="justify-self-center" type="submit" color="primary" [loading]="isSubmitting()">
          Pošalji link
        </app-button>
      </form>

      <a class="mt-4 inline-block text-sm font-medium text-blue-700 hover:underline" routerLink="/login">
        Nazad na prijavu
      </a>
    }
  </mat-card>
</main>
