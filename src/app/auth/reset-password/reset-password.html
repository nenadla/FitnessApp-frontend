<main class="flex min-h-screen items-center justify-center bg-neutral-100 p-4">
  <mat-card class="w-full max-w-md p-6 sm:p-8">
    <h1 class="m-0 text-3xl font-semibold">Resetovanje lozinke</h1>
    <p class="mt-2 text-neutral-600">Unesi novu lozinku za nalog {{ email() || 'korisnika' }}.</p>

    @if (successMessage()) {
      <div class="mt-6 rounded-md border border-green-300 bg-green-50 p-4 text-green-800">
        {{ successMessage() }}
      </div>
      <a class="mt-4 inline-block text-sm font-medium text-blue-700 hover:underline" routerLink="/login">
        Idi na prijavu
      </a>
    } @else if (errorMessage()) {
      <div class="mt-6 rounded-md border border-red-300 bg-red-50 p-4 text-red-800">
        {{ errorMessage() }}
      </div>
      <a class="mt-4 inline-block text-sm font-medium text-blue-700 hover:underline" routerLink="/forgot-password">
        Zatraži novi link
      </a>
    } @else {
      <div class="mt-4 rounded-md border border-neutral-200 bg-neutral-50 p-3 text-sm text-neutral-700">
        Email: <span class="font-medium">{{ email() }}</span>
      </div>

      <form class="mt-6 grid gap-2" (submit)="submit($event)">
        <app-text-input label="Nova lozinka" type="password" autocomplete="new-password" [field]="form.newPassword" />
        <app-text-input label="Potvrdi lozinku" type="password" autocomplete="new-password" [field]="form.confirmPassword" />

        <app-button class="justify-self-center" type="submit" color="primary" [loading]="isSubmitting()">
          Resetuj lozinku
        </app-button>
      </form>

      <a class="mt-4 inline-block text-sm font-medium text-blue-700 hover:underline" routerLink="/login">
        Nazad na prijavu
      </a>
    }
  </mat-card>
</main>
