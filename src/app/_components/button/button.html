<button
    class="custom-button shadow-sm shadow-shade"
    matTooltipShowDelay="300" 
    [matTooltip] = "tooltip()"
    [matTooltipPosition]="tooltipPosition()"
    matRipple 
    [matRippleCentered]="true"
    [disabled]="disabled() || loading()"
    (click)="handleClick($event)"
    [class]="{
        'primary': color() === 'primary',
        'light': color() === 'light',
        'transparent': color() === 'transparent',
        'panel-bg': color() === 'transparent',
        'active': active(),
        'small': size() === 'small'
    }"
    [type]="type()"
>
    <ng-content/>
</button>
@if(loading()){
    <div 
        class="absolute top-0 left-0 w-full h-full flex justify-center items-center cursor-progress rounded-xl"
        [class]="{
            'primary': color() === 'primary',
            'light': color() === 'light',
            'transparent': color() === 'transparent',
            'bg-shade!': color() === 'transparent',
        }"
    >
        <div class="button-spinner"></div>
    </div>
}
