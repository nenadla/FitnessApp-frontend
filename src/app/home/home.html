<div class="flex min-h-screen bg-neutral-100">
  @if (isMobileNavigationOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/35 md:hidden"
      aria-label="Zatvori navigaciju"
      (click)="closeMobileNavigation()"
    ></button>
  }

  <app-sidebar [mobileOpen]="isMobileNavigationOpen()" (mobileClose)="closeMobileNavigation()" />
  <section class="min-w-0 flex-1">
    <app-header (mobileMenuToggle)="toggleMobileNavigation()" />
    <main class="p-4 sm:p-6">
      <router-outlet />
    </main>
  </section>

  <app-button-icon class="fixed bottom-4 right-4 z-30 [&_.custom-button]:size-12 sm:bottom-6 sm:right-6" color="primary" tooltip="Važne informacije" (onClick)="openImportantInfoDialog()">
    <app-icon icon="info-circle" class="size-6 fill-white" />
  </app-button-icon>
</div>
