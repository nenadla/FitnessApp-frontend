<aside class="sidebar" [class.sidebar-expanded]="isNavigationExpanded()" [class.sidebar-mobile-open]="mobileOpen()">
  <div class="flex h-16 w-full items-center px-3">
    @if (isNavigationExpanded()) {
      <span class="text-sm font-semibold uppercase tracking-wider text-violet-200">Meni</span>
    }
    <app-button-icon class="ml-auto hidden md:block" color="transparent-blue" (onClick)="isExpanded.set(!isExpanded())">
      <app-icon [icon]="isExpanded() ? 'close' : 'menu'" class="size-5 stroke-white" />
    </app-button-icon>
    <button
      type="button"
      class="ml-auto grid size-9 place-items-center rounded-lg text-white transition hover:bg-white/10 md:hidden"
      aria-label="Zatvori navigaciju"
      (click)="closeMobileNavigation()"
    >
      <app-icon icon="close" class="size-5 stroke-current" />
    </button>
  </div>

  <nav class="flex w-full flex-col gap-1 px-2">
    @for (item of visibleItems(); track item.link) {
      <a
        class="nav-item"
        [class.nav-item-expanded]="isNavigationExpanded()"
        [routerLink]="item.link"
        routerLinkActive="nav-item-active"
        [routerLinkActiveOptions]="{ exact: true }"
        [matTooltip]="isNavigationExpanded() ? '' : item.label"
        matTooltipPosition="right"
        (click)="closeMobileNavigation()"
      >
        <app-icon [icon]="item.icon" class="size-5 stroke-current" />
        @if (isNavigationExpanded()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
