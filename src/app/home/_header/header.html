<header class="flex h-16 items-center justify-between bg-bg_secondary px-6">
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="grid size-10 place-items-center rounded-xl text-text_primary transition hover:bg-white md:hidden"
      aria-label="Otvori navigaciju"
      (click)="openMobileMenu()"
    >
      <app-icon icon="menu" class="size-5 stroke-current" />
    </button>
    <img
      class="h-12 w-40 object-cover object-center [mask-image:linear-gradient(to_right,transparent,black_12%,black_88%,transparent)] [-webkit-mask-image:linear-gradient(to_right,transparent,black_12%,black_88%,transparent)] sm:w-52"
      src="/assets/photos/retro-fitness-logo.png"
      alt="Retro Fitness"
    />
  </div>
  @if (authService.currentUser(); as user) {
    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-3 rounded-xl px-2 py-1.5 text-left transition hover:bg-white"
        (click)="toggleMenu($event)"
      >
        <span class="grid size-9 place-items-center rounded-full bg-primary text-xs font-bold text-white">
          {{ initials() }}
        </span>
        <span class="hidden text-sm sm:block">
          <span class="block font-semibold text-text_primary">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="block text-xs text-text_secondary">{{ user.role }}</span>
        </span>
        <app-icon icon="chevron-down" class="size-4 stroke-text_secondary" />
      </button>

      @if (isMenuOpen()) {
        <div appClickOutside (clickOutside)="closeMenu()" class="absolute right-0 z-20 mt-2 w-52 overflow-hidden rounded-xl border border-border bg-white p-1 shadow-lg">
          <div class="border-b border-border px-3 py-2">
            <div class="text-sm font-semibold text-text_primary">{{ user.firstName }} {{ user.lastName }}</div>
            <div class="truncate text-xs text-text_secondary">{{ user.email }}</div>
          </div>

          <button
            type="button"
            class="mt-1 flex w-full items-center gap-2 rounded-lg px-3 py-2 text-left text-sm font-medium text-red-600 transition hover:bg-red-50"
            (click)="logout($event)"
          >
            <app-icon icon="logout" class="size-4 stroke-current" />
            Odjavi se
          </button>
        </div>
      }
    </div>
  }
</header>
