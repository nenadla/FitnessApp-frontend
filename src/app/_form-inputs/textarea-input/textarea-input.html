<div class="flex flex-col">
    <div class="flex flex-col relative">
        <label
            class="flex items-center w-fit bg-bg_primary rounded-md px-1 absolute left-2 -translate-y-1/2 top-6 text-sm text-primary_h"
            [class.top-0!]="isFocused() || fieldValue()"
            [class.text-xs!]="isFocused() || fieldValue()"
            [class.text-text_secondary_h!]="isFocused()"
            for="textarea-input-{{label().split(' ').join('-')}}"
        >
            {{label()}} <span class="text-error">{{ isRequired() ? '*' : '' }}</span>
        </label>
        <textarea
            id="textarea-input-{{label().split(' ').join('-')}}"
            class="w-full rounded-xl border-border border outline-none px-3 text-sm min-h-24 pt-3 text-text_primary bg-bg_primary"
            [class.is-invalid]="showErrors()"
            [class.is-focus]="isFocused()"
            (focus)="isFocused.set(true)"
            (blur)="isFocused.set(false)"
            [formField]="field()"
            [placeholder]="isFocused() ? placeholder() : ''"
        >
        </textarea>
    </div>


    @if (showErrors()) {
        <div class="invalid-feedback">{{ firstErrorMessage() }}</div>
    }
    @else{
        <span class="h-3.5"></span>
    }

</div>
